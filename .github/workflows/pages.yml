name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          base64 -d assets.tar.gz.b64 | tar xzf - -C _site
          mkdir -p _site/turn-newsletter-into-podcast
          cp turn-newsletter-into-podcast/index.html _site/turn-newsletter-into-podcast/
          cat newsletter-page.tar.gz.b64.part-* | base64 -d | tar xzf - -C _site
          ls -R _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
